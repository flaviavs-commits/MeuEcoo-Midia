name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validar:
    # Runner fixo: o ubuntu-latest passa para Ubuntu 26 em 19/10/2026; a troca vira uma decisão
    # nossa, testada num PR, e não uma quebra sem commit.
    runs-on: ubuntu-24.04

    # Postgres descartável para `npm run test:db` (tests/integration-db): o schema é recriado do zero.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar lint
        run: npm run lint --if-present

      - name: Executar testes do backend
        run: npm test

      - name: Executar testes contra Postgres real
        run: npm run test:db
        env:
          TEST_DATABASE_URL: postgresql://postgres:teste@localhost:5432/postgres

      - name: Executar testes dos componentes
        run: npm run test:components

      - name: Validar calendário e agendamentos
        run: npm run test:calendar

      - name: Gerar build
        run: npm run frontend:build

  # Constrói a imagem de produção do Railway (Dockerfile) e carrega os módulos nativos, para uma
  # quebra de imagem (versão do Node, bcrypt/sharp no Alpine) aparecer no PR, não no deploy.
  imagem:
    name: Imagem Docker
    runs-on: ubuntu-24.04
    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Construir a imagem
        run: docker build -t meuecoo-api:ci .

      - name: Carregar os módulos nativos na imagem
        run: docker run --rm meuecoo-api:ci node -e "require('bcrypt'); require('sharp'); require('pg'); console.log('módulos nativos ok no Node', process.version)"

  publicar:
    name: Publicar produção
    needs: [validar, imagem]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production

    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Instalar Vercel CLI
        run: npm install --global vercel@59.23.2

      - name: Publicar na Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy . --prod --yes --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID" --project="$VERCEL_PROJECT_ID"
